server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:library}
spring.datasource.username=${DB_USER:library}
spring.datasource.password=${DB_PASSWORD:library}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

app.storage.dir=${STORAGE_DIR:./data/files}
app.backup.dir=${BACKUP_DIR:./data/backup}
app.backup.cron=${BACKUP_CRON:0 0 3 * * *}
app.backup.pg-dump=${PG_DUMP:pg_dump}
app.backup.db-host=${DB_HOST:localhost}
app.backup.db-port=${DB_PORT:5433}
app.backup.db-name=${DB_NAME:library}
app.backup.db-user=${DB_USER:library}
app.backup.db-password=${DB_PASSWORD:library}

app.seed.moderator-login=${MODERATOR_LOGIN:moderator}
app.seed.moderator-password=${MODERATOR_PASSWORD:moderator123}
